<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Review</title>
<style>
  :root{
    --bg-grad-1:#e9e2fb;
    --bg-grad-2:#b9a6f2;
    --ink:#14121f;
    --muted:#6b6478;
    --card:#ffffff;
    --card-border:#ece8f7;
    --accent:#4f39f6;
    --accent-soft:#eeeafd;
    --green:#0f9d58;
    --green-soft:#e6f7ee;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 30% 20%, var(--bg-grad-1), var(--bg-grad-2) 70%);
    padding:40px 20px;
  }
  .card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:24px;
    box-shadow: 0 30px 60px -20px rgba(20,10,50,.35);
    overflow:hidden;
  }
  .header{
    padding:24px 24px 16px;
  }
  .header h1{
    margin:0;
    font-size:26px;
    letter-spacing:-0.02em;
    font-weight:800;
    color:var(--ink);
  }
  hr.top{
    border:none;
    border-top:1px solid var(--card-border);
    margin:0 24px;
  }
  .content{
    padding:16px 18px 22px;
  }
  .product-card{
    display:flex;
    gap:14px;
    background:#fafaff;
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:16px;
    align-items:flex-start;
  }
  .thumb{
    width:66px;height:66px;
    border-radius:14px;
    background:linear-gradient(135deg,#4a2fd6,#8a5cf5);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    position:relative;
    overflow:hidden;
  }
  .thumb svg{width:34px;height:34px;stroke:#fff;}
  .prod-info{flex:1;}
  .badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:11px;
    font-weight:700;
    letter-spacing:.03em;
    padding:4px 9px;
    border-radius:20px;
    margin-bottom:8px;
  }
  .badge::before{
    content:"";
    width:6px;height:6px;
    border-radius:50%;
    background:var(--accent);
  }
  .prod-info h2{
    margin:0 0 4px;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
  }
  .prod-info .spec{
    margin:0 0 10px;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.4;
  }
  .prod-info .price{
    font-size:19px;
    font-weight:800;
    color:var(--ink);
  }
  .section-label{
    text-align:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--muted);
    margin:22px 0 12px;
    position:relative;
  }
  .section-label::before,.section-label::after{
    content:"";
    position:absolute;
    top:50%;
    width:26%;
    border-top:1px solid var(--card-border);
  }
  .section-label::before{left:0;}
  .section-label::after{right:0;}
  .addon-card{
    background:var(--accent-soft);
    border:1px solid #dcd3fb;
    border-radius:18px;
    padding:18px;
  }
  .addon-top{
    display:flex;
    gap:12px;
    margin-bottom:14px;
  }
  .addon-icon{
    width:38px;height:38px;
    border-radius:11px;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .addon-icon svg{width:20px;height:20px;stroke:#fff;fill:none;}
  .addon-text h3{
    margin:0 0 3px;
    font-size:15.5px;
    font-weight:700;
    color:var(--ink);
  }
  .addon-text p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.4;
  }
  .addon-bottom{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  .addon-price{
    font-size:23px;
    font-weight:800;
    color:var(--ink);
  }
  .addon-price span{
    font-size:13px;
    font-weight:500;
    color:var(--muted);
  }
  .addon-note{
    display:block;
    margin-top:6px;
    background:var(--green-soft);
    color:var(--green);
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    width:fit-content;
  }
  .add-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:11px 22px;
    border-radius:12px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  .totals{
    margin-top:22px;
    background:#fafaff;
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:16px 18px;
  }
  .totals .row{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:var(--ink);
    padding:5px 0;
  }
  .totals .row.free{color:var(--green);font-weight:600;}
  .totals hr{
    border:none;
    border-top:1px solid var(--card-border);
    margin:8px 0;
  }
  .totals .row.total{
    font-size:16px;
    font-weight:800;
  }
  .cta{
    margin:20px 18px 22px;
  }
  .cta button{
    width:100%;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:15px;
    border-radius:14px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Order Review</h1>
  </div>
  <hr class="top">

  <div class="content">
    <div class="product-card">
      <div class="thumb" data-field="product_image">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke="#ffffffaa"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="M5 17l4.5-5 3 3.5L17 11l3 6"/></svg>
      </div>
      <div class="prod-info">
        <span class="badge">IN STOCK</span>
        <h2 data-field="product_name">Product name</h2>
        <p class="spec" data-field="product_spec">Product specification</p>
        <div class="price" data-field="product_price">Rp0</div>
      </div>
    </div>

    <div class="section-label">RECOMMENDED FOR YOU</div>

    <div class="addon-card">
      <div class="addon-top">
        <div class="addon-icon">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z"/></svg>
        </div>
        <div class="addon-text">
          <h3 data-field="addon_name">Add-on name</h3>
          <p data-field="addon_desc">Add-on description</p>
        </div>
      </div>
      <div class="addon-bottom">
        <div>
          <div class="addon-price" data-field="addon_price">$0<span>/month</span></div>
          <span class="addon-note" data-field="addon_note">Note</span>
        </div>
        <button class="add-btn">Add</button>
      </div>
    </div>

    <div class="totals">
      <div class="row"><span>Subtotal</span><span data-field="subtotal">$0.00</span></div>
      <div class="row free"><span>Shipping</span><span data-field="shipping">Free</span></div>
      <hr>
      <div class="row total"><span>Total</span><span data-field="total">$0</span></div>
    </div>
  </div>

  <div class="cta">
    <button class="checkout-btn" data-field="checkout_label">Checkout</button>
    <button class="wa-btn" style="width:100%;margin-top:10px;background:#25D366;color:#fff;border:none;padding:13px;border-radius:14px;font-size:14px;font-weight:700;cursor:pointer;display:none;align-items:center;justify-content:center;gap:8px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="#fff"><path d="M12.04 2c-5.46 0-9.9 4.44-9.9 9.9 0 1.75.46 3.45 1.32 4.95L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.44 9.9-9.9S17.5 2 12.04 2zm5.8 14.06c-.24.68-1.4 1.3-1.93 1.36-.5.06-1.02.27-3.42-.71-2.9-1.19-4.76-4.15-4.9-4.35-.14-.19-1.17-1.56-1.17-2.97 0-1.42.74-2.1 1-2.39.26-.28.58-.35.77-.35.19 0 .39 0 .55.01.18.01.42-.07.65.5.24.58.83 2 .9 2.15.07.15.12.32.02.51-.09.19-.14.31-.28.48-.14.16-.29.36-.42.49-.14.13-.28.28-.12.55.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.21 1.37.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.18-.28.36-.23.6-.14.24.09 1.53.72 1.79.85.26.13.44.19.5.3.07.11.07.62-.17 1.3z"/></svg>
      <span data-field="wa_button_label">Kirim Struk via WhatsApp</span>
    </button>
    <div class="qr-wrap" data-field="checkout_qr_wrap" style="display:none;text-align:center;margin-top:16px;">
      <img data-field="checkout_qr_img" src="" alt="QR pembayaran" style="width:160px;height:160px;border-radius:12px;border:1px solid var(--card-border);object-fit:contain;">
      <p style="margin:8px 0 0;font-size:11.5px;color:var(--muted);">Pindai untuk membayar</p>
    </div>
  </div>
</div>

<script type="module" src="js/order_review.js"></script>

</body>
</html>
