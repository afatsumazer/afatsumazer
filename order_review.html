<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Review</title>
<style>
  :root{
    --bg-grad-1:#e9e2fb;
    --bg-grad-2:#b9a6f2;
    --ink:#14121f;
    --muted:#6b6478;
    --card:#ffffff;
    --card-border:#ece8f7;
    --accent:#4f39f6;
    --accent-soft:#eeeafd;
    --green:#0f9d58;
    --green-soft:#e6f7ee;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
      radial-gradient(circle at 30% 20%, var(--bg-grad-1), var(--bg-grad-2) 70%);
    padding:40px 20px;
  }
  .phone{
    width:340px;
    background:#fff;
    border-radius:44px;
    border:8px solid #0b0b0f;
    box-shadow: 0 40px 80px -20px rgba(20,10,50,.45), 0 0 0 2px rgba(255,255,255,.4) inset;
    overflow:hidden;
    position:relative;
  }
  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 24px 6px;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
  }
  .statusbar .icons{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .pill{
    width:18px;height:10px;border:1.5px solid var(--ink);border-radius:3px;position:relative;
  }
  .pill::after{
    content:"";
    position:absolute;
    right:-4px;top:2px;
    width:2px;height:4px;
    background:var(--ink);
    border-radius:1px;
  }
  .pill .fill{
    position:absolute;
    top:1px;left:1px;bottom:1px;
    width:70%;
    background:var(--ink);
    border-radius:1.5px;
  }
  .header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 22px 14px;
  }
  .header h1{
    margin:0;
    font-size:26px;
    letter-spacing:-0.02em;
    font-weight:800;
    color:var(--ink);
  }
  .header .edit{
    font-size:15px;
    font-weight:600;
    color:var(--accent);
  }
  hr.top{
    border:none;
    border-top:1px solid var(--card-border);
    margin:0 22px;
  }
  .content{
    padding:16px 18px 22px;
  }
  .product-card{
    display:flex;
    gap:14px;
    background:#fafaff;
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:16px;
    align-items:flex-start;
  }
  .thumb{
    width:66px;height:66px;
    border-radius:14px;
    background:linear-gradient(135deg,#4a2fd6,#8a5cf5);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    position:relative;
    overflow:hidden;
  }
  .thumb svg{width:34px;height:34px;stroke:#fff;}
  .prod-info{flex:1;}
  .badge{
    display:inline-flex;
    align-items:center;
    gap:5px;
    background:var(--accent-soft);
    color:var(--accent);
    font-size:11px;
    font-weight:700;
    letter-spacing:.03em;
    padding:4px 9px;
    border-radius:20px;
    margin-bottom:8px;
  }
  .badge::before{
    content:"";
    width:6px;height:6px;
    border-radius:50%;
    background:var(--accent);
  }
  .prod-info h2{
    margin:0 0 4px;
    font-size:17px;
    font-weight:700;
    color:var(--ink);
  }
  .prod-info .spec{
    margin:0 0 10px;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.4;
  }
  .prod-info .price{
    font-size:19px;
    font-weight:800;
    color:var(--ink);
  }
  .section-label{
    text-align:center;
    font-size:11px;
    font-weight:700;
    letter-spacing:.08em;
    color:var(--muted);
    margin:22px 0 12px;
    position:relative;
  }
  .section-label::before,.section-label::after{
    content:"";
    position:absolute;
    top:50%;
    width:26%;
    border-top:1px solid var(--card-border);
  }
  .section-label::before{left:0;}
  .section-label::after{right:0;}
  .addon-card{
    background:var(--accent-soft);
    border:1px solid #dcd3fb;
    border-radius:18px;
    padding:18px;
  }
  .addon-top{
    display:flex;
    gap:12px;
    margin-bottom:14px;
  }
  .addon-icon{
    width:38px;height:38px;
    border-radius:11px;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .addon-icon svg{width:20px;height:20px;stroke:#fff;fill:none;}
  .addon-text h3{
    margin:0 0 3px;
    font-size:15.5px;
    font-weight:700;
    color:var(--ink);
  }
  .addon-text p{
    margin:0;
    font-size:12.5px;
    color:var(--muted);
    line-height:1.4;
  }
  .addon-bottom{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }
  .addon-price{
    font-size:23px;
    font-weight:800;
    color:var(--ink);
  }
  .addon-price span{
    font-size:13px;
    font-weight:500;
    color:var(--muted);
  }
  .addon-note{
    display:block;
    margin-top:6px;
    background:var(--green-soft);
    color:var(--green);
    font-size:11.5px;
    font-weight:700;
    padding:3px 9px;
    border-radius:20px;
    width:fit-content;
  }
  .add-btn{
    background:var(--accent);
    color:#fff;
    border:none;
    padding:11px 22px;
    border-radius:12px;
    font-size:14.5px;
    font-weight:700;
    cursor:pointer;
  }
  .totals{
    margin-top:22px;
    background:#fafaff;
    border:1px solid var(--card-border);
    border-radius:18px;
    padding:16px 18px;
  }
  .totals .row{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    color:var(--ink);
    padding:5px 0;
  }
  .totals .row.free{color:var(--green);font-weight:600;}
  .totals hr{
    border:none;
    border-top:1px solid var(--card-border);
    margin:8px 0;
  }
  .totals .row.total{
    font-size:16px;
    font-weight:800;
  }
  .cta{
    margin:20px 18px 22px;
  }
  .cta button{
    width:100%;
    background:var(--ink);
    color:#fff;
    border:none;
    padding:15px;
    border-radius:14px;
    font-size:15.5px;
    font-weight:700;
    cursor:pointer;
  }
</style>
</head>
<body>

<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <div class="icons">
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none"><path d="M8 2c2.5 0 4.7 1 6.3 2.6l-1.4 1.4C11.6 4.7 9.9 4 8 4s-3.6.7-4.9 2L1.7 4.6C3.3 3 5.5 2 8 2z" fill="#14121f"/><path d="M8 6c1.4 0 2.6.6 3.5 1.5l-1.4 1.4C9.6 8.3 8.9 8 8 8s-1.6.3-2.1.9L4.5 7.5C5.4 6.6 6.6 6 8 6z" fill="#14121f"/><circle cx="8" cy="10" r="1.2" fill="#14121f"/></svg>
      <div class="pill"><div class="fill"></div></div>
    </div>
  </div>

  <div class="header">
    <h1>Order Review</h1>
    <span class="edit">Edit</span>
  </div>
  <hr class="top">

  <div class="content">
    <div class="product-card">
      <div class="thumb" data-field="product_image">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke="#ffffffaa"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="9" cy="9" r="1.6"/><path d="M5 17l4.5-5 3 3.5L17 11l3 6"/></svg>
      </div>
      <div class="prod-info">
        <span class="badge">IN STOCK</span>
        <h2 data-field="product_name">Product name</h2>
        <p class="spec" data-field="product_spec">Product specification</p>
        <div class="price" data-field="product_price">$0</div>
      </div>
    </div>

    <div class="section-label">RECOMMENDED FOR YOU</div>

    <div class="addon-card">
      <div class="addon-top">
        <div class="addon-icon">
          <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z"/></svg>
        </div>
        <div class="addon-text">
          <h3 data-field="addon_name">Add-on name</h3>
          <p data-field="addon_desc">Add-on description</p>
        </div>
      </div>
      <div class="addon-bottom">
        <div>
          <div class="addon-price" data-field="addon_price">$0<span>/month</span></div>
          <span class="addon-note" data-field="addon_note">Note</span>
        </div>
        <button class="add-btn">Add</button>
      </div>
    </div>

    <div class="totals">
      <div class="row"><span>Subtotal</span><span data-field="subtotal">$0.00</span></div>
      <div class="row free"><span>Shipping</span><span data-field="shipping">Free</span></div>
      <hr>
      <div class="row total"><span>Total</span><span data-field="total">$0</span></div>
    </div>
  </div>

  <div class="cta">
    <button data-field="checkout_label">Checkout</button>
    <div class="qr-wrap" data-field="checkout_qr_wrap" style="display:none;text-align:center;margin-top:16px;">
      <img data-field="checkout_qr_img" src="" alt="QR pembayaran" style="width:160px;height:160px;border-radius:12px;border:1px solid var(--card-border);object-fit:contain;">
      <p style="margin:8px 0 0;font-size:11.5px;color:var(--muted);">Pindai untuk membayar</p>
    </div>
  </div>
</div>

<script type="module" src="js/order_review.js"></script>

</body>
</html>
