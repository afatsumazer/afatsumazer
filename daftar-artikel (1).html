<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semua Artikel</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
</style>
</head>
<body class="bg-gray-50 text-gray-800 pb-16 min-h-screen">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
        <div class="max-w-2xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-lg">📚</span>
                <h1 class="text-lg font-black text-gray-900 tracking-tight">Semua Artikel</h1>
            </div>
            <a href="index.html" class="text-xs font-semibold text-gray-600 hover:bg-gray-100 px-3 py-2 rounded-xl transition">
                &larr; Beranda
            </a>
        </div>
    </header>

    <div class="max-w-2xl mx-auto px-4 sm:px-6 mt-6">
        <input id="search-input" type="text" placeholder="Cari artikel..." oninput="filterArticles()" class="w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm mb-5 bg-white">

        <div id="articles-list" class="space-y-4">
            <div class="py-10 text-center text-xs text-gray-400">Memuat artikel...</div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Konfigurasi sama persis dengan file lain — satu project Firebase yang sama.
    // Halaman ini TIDAK memerlukan login, artikel published memang boleh dibaca publik.
    const firebaseConfig = {
        apiKey: "AIzaSyDg2b6LERZ2zE86mTiYvUO1Uj--lAtpmgM",
        authDomain: "afatsumazer-app.firebaseapp.com",
        databaseURL: "https://afatsumazer-app-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "afatsumazer-app",
        storageBucket: "afatsumazer-app.firebasestorage.app",
        messagingSenderId: "16280759060",
        appId: "1:16280759060:web:fd4deacafdf5cadd777001",
        measurementId: "G-WB9YW9D726"
    };

    const app = initializeApp(firebaseConfig);
    const firestore = getFirestore(app);

    let allArticles = [];

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderList(items) {
        const container = document.getElementById('articles-list');

        if (items.length === 0) {
            container.innerHTML = `<div class="py-10 text-center text-xs text-gray-400">Belum ada artikel yang tayang.</div>`;
            return;
        }

        container.innerHTML = items.map(a => `
            <a href="/${encodeURIComponent(a.slug)}" class="block bg-white rounded-2xl border border-gray-200 shadow-sm hover:shadow-md hover:border-indigo-200 transition overflow-hidden">
                <div class="flex items-stretch">
                    ${a.cover ? `
                        <div class="w-24 sm:w-32 shrink-0 bg-gray-100">
                            <img src="${a.cover}" class="w-full h-full object-cover" alt="">
                        </div>
                    ` : ''}
                    <div class="p-4 min-w-0 flex flex-col justify-center">
                        <h3 class="text-sm font-extrabold text-gray-900 line-clamp-2">${escapeHtml(a.title)}</h3>
                        ${a.authorName ? `<p class="text-[11px] text-gray-400 mt-1">Oleh ${escapeHtml(a.authorName)}</p>` : ''}
                    </div>
                </div>
            </a>
        `).join('');
    }

    window.filterArticles = function() {
        const q = document.getElementById('search-input').value.trim().toLowerCase();
        if (!q) { renderList(allArticles); return; }
        renderList(allArticles.filter(a => (a.title || '').toLowerCase().includes(q)));
    };

    // Ambil semua artikel berstatus "published" secara real-time, urut terbaru dulu
    const q = query(collection(firestore, 'articles'), where('status', '==', 'published'));
    onSnapshot(q, (snapshot) => {
        const items = [];
        snapshot.forEach(d => items.push({ slug: d.id, ...d.data() }));
        items.sort((a, b) => {
            const ta = a.updatedAt && a.updatedAt.toMillis ? a.updatedAt.toMillis() : 0;
            const tb = b.updatedAt && b.updatedAt.toMillis ? b.updatedAt.toMillis() : 0;
            return tb - ta;
        });
        allArticles = items;
        renderList(allArticles);
    }, err => {
        document.getElementById('articles-list').innerHTML =
            `<div class="py-10 text-center text-xs text-red-400">Gagal memuat artikel: ${err.message}</div>`;
    });
</script>
</body>
</html>
