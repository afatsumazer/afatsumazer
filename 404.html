<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sinyal Hilang — AppSaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#0B1120;
    --bg-mid:#131B33;
    --teal:#2DD4BF;
    --violet:#8B5CF6;
    --text-main:#E7ECF6;
    --text-muted:#7C89AA;
    --card-bg:rgba(19,27,51,0.55);
    --card-border:rgba(255,255,255,0.08);
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    height:100%;
    background:var(--bg-deep);
    color:var(--text-main);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }

  /* ---------- Latar: nebula bergerak + bintang ---------- */
  .sky{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(45,212,191,0.10), transparent 55%),
      radial-gradient(ellipse at 80% 75%, rgba(139,92,246,0.14), transparent 55%),
      var(--bg-deep);
  }

  .blob{
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.55;
    animation:drift 26s ease-in-out infinite;
  }
  .blob.b1{ width:420px; height:420px; background:var(--teal); top:-120px; left:-100px; animation-delay:0s;}
  .blob.b2{ width:380px; height:380px; background:var(--violet); bottom:-140px; right:-80px; animation-delay:-9s;}
  .blob.b3{ width:260px; height:260px; background:#3B82F6; top:40%; left:60%; animation-delay:-16s; opacity:0.35;}

  @keyframes drift{
    0%,100%{ transform:translate(0,0) scale(1); }
    33%{ transform:translate(40px,-30px) scale(1.08); }
    66%{ transform:translate(-30px,25px) scale(0.95); }
  }

  .star{
    position:absolute;
    width:2px; height:2px;
    background:#fff;
    border-radius:50%;
    animation:twinkle var(--dur,4s) ease-in-out infinite;
    opacity:0.4;
  }
  @keyframes twinkle{
    0%,100%{ opacity:0.15; }
    50%{ opacity:0.9; }
  }

  /* ---------- Konten ---------- */
  .stage{
    position:relative;
    z-index:1;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:24px;
    text-align:center;
  }

  .eyebrow{
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--teal);
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:14px;
  }
  .eyebrow .dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 8px var(--teal);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }

  h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:clamp(28px,5vw,40px);
    font-weight:700;
    margin:0 0 6px;
    color:#fff;
    letter-spacing:-0.01em;
  }
  .subtitle{
    color:var(--text-muted);
    font-size:14px;
    max-width:380px;
    margin:0 0 34px;
    line-height:1.6;
  }
  .subtitle b{ color:var(--text-main); font-weight:600; }

  /* ---------- Kartu melayang (perspective + tilt) ---------- */
  .perspective-wrap{
    perspective:1000px;
    touch-action:none;
  }

  .card{
    width:300px;
    background:var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:22px;
    padding:26px 22px 20px;
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.6),
      0 0 0 1px rgba(255,255,255,0.02) inset;
    cursor:grab;
    transform-style:preserve-3d;
    animation:float 5s ease-in-out infinite;
    transition:transform 0.15s ease-out, opacity 0.35s ease;
  }
  .card:active{ cursor:grabbing; animation-play-state:paused; }
  .card.dragging{ transition:none; }
  .card.fade{ opacity:0; }

  @keyframes float{
    0%,100%{ transform:translateY(0px) rotateX(0deg) rotateY(0deg); }
    50%{ transform:translateY(-10px) rotateX(0deg) rotateY(0deg); }
  }

  @media (prefers-reduced-motion:reduce){
    .card, .blob, .star{ animation:none !important; }
  }

  .avatar-ring{
    width:76px; height:76px;
    border-radius:50%;
    margin:0 auto 14px;
    padding:3px;
    background:conic-gradient(from 0deg, var(--teal), var(--violet), var(--teal));
    animation:spin 6s linear infinite;
  }
  @media (prefers-reduced-motion:reduce){ .avatar-ring{ animation:none; } }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .avatar-ring img{
    width:100%; height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:3px solid var(--bg-mid);
  }

  .name-row{
    display:flex; align-items:center; justify-content:center; gap:5px;
  }
  .name-row span.name{
    font-weight:700; font-size:15px; color:#fff;
  }
  .badge-verified svg{ width:15px; height:15px; color:var(--teal); }
  .badge-verified.hidden{ display:none; }

  .username{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;
    color:var(--text-muted);
    margin:2px 0 12px;
  }

  .premium{
    display:inline-flex;
    align-items:center;
    gap:4px;
    font-size:10px;
    font-weight:700;
    letter-spacing:0.08em;
    text-transform:uppercase;
    padding:3px 10px;
    border-radius:99px;
    background:rgba(251,191,36,0.12);
    color:#FBBF24;
    border:1px solid rgba(251,191,36,0.25);
    margin-bottom:12px;
  }
  .premium.hidden{ display:none; }

  .bio{
    font-size:13px;
    line-height:1.6;
    color:#C7D0E6;
    background:rgba(255,255,255,0.03);
    border:1px solid rgba(255,255,255,0.05);
    border-radius:14px;
    padding:12px 14px;
    min-height:52px;
  }

  .view-link{
    display:inline-block;
    margin-top:14px;
    font-size:12px;
    font-weight:600;
    color:var(--teal);
    text-decoration:none;
    border-bottom:1px solid transparent;
  }
  .view-link:hover{ border-bottom-color:var(--teal); }

  /* ---------- Progress "penguncian sinyal" ---------- */
  .lock-wrap{
    width:300px;
    margin-top:18px;
    display:flex;
    align-items:center;
    gap:10px;
  }
  .lock-track{
    flex:1;
    height:3px;
    background:rgba(255,255,255,0.08);
    border-radius:99px;
    overflow:hidden;
  }
  .lock-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--teal), var(--violet));
    border-radius:99px;
  }
  .lock-label{
    font-family:'JetBrains Mono',monospace;
    font-size:10px;
    color:var(--text-muted);
    white-space:nowrap;
  }

  .home-link{
    margin-top:22px;
    font-family:'JetBrains Mono',monospace;
    font-size:11px;
    color:var(--text-muted);
    text-decoration:none;
    letter-spacing:0.04em;
  }
  .home-link:hover{ color:var(--text-main); }
</style>
</head>
<body>

  <div class="sky" id="sky">
    <div class="blob b1"></div>
    <div class="blob b2"></div>
    <div class="blob b3"></div>
  </div>

  <div class="stage">
    <div class="eyebrow"><span class="dot"></span>404 · SINYAL TERSESAT</div>
    <h1>Halaman tidak ditemukan</h1>
    <p class="subtitle">Alamat yang kamu tuju sudah tidak ada. Sambil menunggu, ini <b>profil pengguna</b> yang sedang termuat secara acak — sentuh kartunya untuk memutar.</p>

    <div class="perspective-wrap">
      <div class="card" id="card">
        <div class="avatar-ring">
          <img id="profile-preview" src="https://via.placeholder.com/150" alt="Avatar">
        </div>
        <div class="name-row">
          <span class="name" id="preview-name">Memuat...</span>
          <span class="badge-verified hidden" id="badge-verified">
            <svg fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l5-5z" clip-rule="evenodd"></path></svg>
          </span>
        </div>
        <p class="username" id="preview-username">@username</p>
        <div class="premium hidden" id="badge-premium">⭐ Member Premium</div>
        <p class="bio" id="display-bio">Memuat bio...</p>
        <a href="#" class="view-link" id="view-link">Lihat profil lengkap →</a>
      </div>
    </div>

    <div class="lock-wrap">
      <div class="lock-track"><div class="lock-fill" id="lock-fill"></div></div>
      <span class="lock-label" id="lock-label">20s</span>
    </div>

    <a href="index.html" class="home-link">← Kembali ke beranda</a>
  </div>

  <div id="debug-box" style="position:fixed;bottom:0;left:0;right:0;max-height:40vh;overflow-y:auto;background:#000;color:#0f0;font-family:monospace;font-size:11px;padding:10px;z-index:9999;"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDg2b6LERZ2zE86mTiYvUO1Uj--lAtpmgM",
    authDomain: "afatsumazer-app.firebaseapp.com",
    databaseURL: "https://afatsumazer-app-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "afatsumazer-app",
    storageBucket: "afatsumazer-app.firebasestorage.app",
    messagingSenderId: "16280759060",
    appId: "1:16280759060:web:fd4deacafdf5cadd777001",
    measurementId: "G-WB9YW9D726"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const CYCLE_SECONDS = 20;
  let allUids = [];
  let lastUid = null;
  let tickInterval, cycleTimeout;
  let elapsed = 0;

  const card = document.getElementById('card');
  const fillEl = document.getElementById('lock-fill');
  const labelEl = document.getElementById('lock-label');

  function debugLog(msg) {
    const box = document.getElementById('debug-box');
    if (box) box.innerHTML += msg + "<br>";
  }

  function renderProfile(uid, data) {
    document.getElementById('profile-preview').src = data.photo || "https://via.placeholder.com/150";
    document.getElementById('preview-name').innerText = data.name || "Pengguna";
    document.getElementById('preview-username').innerText = data.username ? "@" + data.username : "@username";
    document.getElementById('display-bio').innerText = data.bio || "Belum ada bio singkat.";
    document.getElementById('badge-verified').classList.toggle('hidden', data.isVerified !== true);
    document.getElementById('badge-premium').classList.toggle('hidden', data.isPremium !== true);
    document.getElementById('view-link').href = `view-profile.html?id=${uid}`;
  }

  async function loadRandomProfile() {
    if (allUids.length === 0) return;

    let pick = allUids[Math.floor(Math.random() * allUids.length)];
    if (allUids.length > 1) {
      while (pick === lastUid) {
        pick = allUids[Math.floor(Math.random() * allUids.length)];
      }
    }
    lastUid = pick;

    const snap = await get(ref(db, `users/${pick}/profile`));
    if (!snap.exists()) return;

    card.classList.add('fade');
    setTimeout(() => {
      renderProfile(pick, snap.val());
      card.classList.remove('fade');
    }, 350);
  }

  function startCycle() {
    elapsed = 0;
    clearInterval(tickInterval);
    tickInterval = setInterval(() => {
      elapsed += 0.1;
      const pct = Math.min(100, (elapsed / CYCLE_SECONDS) * 100);
      fillEl.style.width = pct + '%';
      const remaining = Math.max(0, Math.ceil(CYCLE_SECONDS - elapsed));
      labelEl.innerText = remaining + 's';
      if (elapsed >= CYCLE_SECONDS) {
        elapsed = 0;
        loadRandomProfile();
      }
    }, 100);
  }

  async function init() {
    debugLog("Mulai ambil data users...");
    try {
      const snapshot = await get(ref(db, 'users'));
      debugLog("Snapshot exists: " + snapshot.exists());
      if (snapshot.exists()) {
        allUids = Object.keys(snapshot.val());
        debugLog("Jumlah user ditemukan: " + allUids.length);
        await loadRandomProfile();
        debugLog("Profil pertama dimuat. Siklus 20 detik dimulai.");
        startCycle();
      } else {
        debugLog("Node 'users' kosong / tidak ada.");
        document.getElementById('preview-name').innerText = "Belum ada pengguna";
      }
    } catch (err) {
      debugLog("GAGAL: " + err.message);
    }
  }

  // ---------- Efek tilt 3D saat disentuh / diklik-drag ----------
  let dragging = false;
  let startX = 0, startY = 0;

  function setTilt(rx, ry) {
    card.style.transform = `translateY(-4px) rotateX(${rx}deg) rotateY(${ry}deg)`;
  }

  function resetTilt() {
    card.classList.remove('dragging');
    card.style.transform = '';
  }

  function pointerDown(x, y) {
    dragging = true;
    startX = x; startY = y;
    card.classList.add('dragging');
  }

  function pointerMove(x, y) {
    if (!dragging) return;
    const dx = x - startX;
    const dy = y - startY;
    const ry = Math.max(-25, Math.min(25, dx / 4));
    const rx = Math.max(-25, Math.min(25, -dy / 4));
    setTilt(rx, ry);
  }

  function pointerUp() {
    if (!dragging) return;
    dragging = false;
    resetTilt();
  }

  card.addEventListener('mousedown', (e) => pointerDown(e.clientX, e.clientY));
  window.addEventListener('mousemove', (e) => pointerMove(e.clientX, e.clientY));
  window.addEventListener('mouseup', pointerUp);

  card.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    pointerDown(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    pointerMove(t.clientX, t.clientY);
  }, { passive: true });
  window.addEventListener('touchend', pointerUp);

  // ---------- Bintang latar (dibuat acak) ----------
  function spawnStars() {
    const sky = document.getElementById('sky');
    const count = window.innerWidth < 640 ? 40 : 80;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.setProperty('--dur', (2 + Math.random() * 4) + 's');
      s.style.animationDelay = (Math.random() * 4) + 's';
      sky.appendChild(s);
    }
  }

  spawnStars();
  document.addEventListener('DOMContentLoaded', init);
  init();
</script>
</body>
</html>
