<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin - Afatsumazer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-16 min-h-screen">

    <div id="access-checking" class="min-h-screen flex items-center justify-center">
        <p class="text-xs font-bold text-gray-400">Memeriksa akses super admin...</p>
    </div>

    <div id="access-denied" class="hidden min-h-screen flex-col items-center justify-center text-center px-6">
        <div class="text-4xl mb-3">🔒</div>
        <h1 class="text-lg font-black text-gray-900">Akses ditolak</h1>
        <p class="text-xs text-gray-500 mt-1 max-w-xs">Akun ini bukan Super Admin.</p>
        <a href="login.html" class="mt-4 text-xs font-bold text-indigo-600 hover:underline">&larr; Kembali ke Login</a>
    </div>

    <div id="superadmin-content" class="hidden">
        <header class="bg-white border-b border-gray-200 sticky top-0 z-30 shadow-sm">
            <div class="max-w-4xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="text-lg">🛡️</span>
                    <h1 class="text-sm font-black text-gray-900 tracking-tight">Super Admin — Kelola Institusi</h1>
                </div>
                <button onclick="superadminLogout()" class="text-xs font-semibold text-red-600 hover:bg-red-50 px-3 py-2 rounded-xl transition">Keluar</button>
            </div>
        </header>

        <div class="max-w-4xl mx-auto px-4 sm:px-6 mt-6 space-y-6">

            <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                <h3 class="font-extrabold text-sm text-gray-900 mb-1">Daftarkan Institusi Baru</h3>
                <p class="text-xs text-gray-500 mb-4">Membuat institusi sekaligus akun admin pertamanya. Institusi langsung berstatus Aktif.</p>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <input id="inst-nama" type="text" placeholder="Nama institusi / perusahaan" class="border border-gray-200 rounded-xl px-3 py-2 text-xs font-semibold">
                    <input id="inst-alamat" type="text" placeholder="Alamat (opsional)" class="border border-gray-200 rounded-xl px-3 py-2 text-xs font-semibold">
                    <input id="inst-admin-nama" type="text" placeholder="Nama admin pertama" class="border border-gray-200 rounded-xl px-3 py-2 text-xs font-semibold">
                    <input id="inst-admin-email" type="email" placeholder="Email admin" class="border border-gray-200 rounded-xl px-3 py-2 text-xs font-semibold">
                    <input id="inst-admin-password" type="text" placeholder="Password awal (min 6 karakter)" class="sm:col-span-2 border border-gray-200 rounded-xl px-3 py-2 text-xs font-semibold">
                </div>
                <button onclick="createInstitusi()" class="mt-4 w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-700 hover:to-violet-700 text-white font-extrabold px-4 py-2.5 rounded-xl text-xs shadow-sm transition">
                    + Daftarkan Institusi & Buat Admin
                </button>
                <p id="inst-create-status" class="text-[10px] text-gray-400 mt-2"></p>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-gray-200 shadow-sm">
                <h3 class="font-extrabold text-sm text-gray-900 mb-4">Daftar Institusi</h3>
                <div id="institusi-list" class="space-y-2">
                    <div class="py-6 text-center text-xs text-gray-400">Memuat daftar institusi...</div>
                </div>
            </div>
        </div>
    </div>

    <div id="superadmin-toast" class="fixed left-1/2 -bottom-16 -translate-x-1/2 bg-gray-900 text-white text-xs font-bold px-4 py-2.5 rounded-xl z-50 transition-all duration-300"></div>

    <script type="module" src="js/superadmin.js"></script>
</body>
</html>
